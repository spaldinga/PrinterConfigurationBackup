[fan_generic heaterfans]
pin: PC7
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[fan_generic nevermore]
pin: PC8
max_power: 1
shutdown_speed: 0.0
kick_start_time: 5.0

[fan_generic RSCS]
pin: PC6
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PC4

[gcode_macro DISABLE_FANS]
gcode:
      SET_FAN_SPEED FAN=nevermore SPEED=0
      SET_FAN_SPEED FAN=heaterfans SPEED=0
      M106 S0

[gcode_macro ENABLE_FANS]
gcode:
      SET_FAN_SPEED FAN=nevermore SPEED=0.7
      SET_FAN_SPEED FAN=heaterfans SPEED=0.7

[gcode_macro ENABLE_FANS_TURBO]
gcode:
      SET_FAN_SPEED FAN=nevermore SPEED=1
      SET_FAN_SPEED FAN=heaterfans SPEED=1