[heater_bed]
heater_pin: PC9                      # Connected to BED
sensor_type: Generic 3950
sensor_pin: PA0                      # Connected to slot THB
min_temp: -200
max_temp: 120
pwm_cycle_time: 0.01
#control: pid                         # REQUIRES CALIBRATION!
#pid_Kp: 74.743
#pid_Ki: 2.195
#pid_Kd: 636.252

#####################################################################
#   Buildblate corner temp Sensor
#   https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/issues/632
#####################################################################

[temperature_sensor buildplate]
sensor_type: Generic 3950
sensor_pin:  PA7
pullup_resistor: 10000

[bed_mesh]
speed: 300
horizontal_move_z: 5
#zero_reference_position: 117.5, 82 # Set this value to be the same as home_xy_position that is in the section safe_z_home
mesh_min: 15, 25
mesh_max: 220, 200
probe_count: 7,7
#mesh_pps: 2,2
#fade_start: 1
#fade_end: 10
#fade_target: 0
algorithm: bicubic