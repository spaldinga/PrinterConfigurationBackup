[include shell_command.cfg]
[include mainsail.cfg]

#####################################################################
#   Hardware
#####################################################################
[include hardware/fly_sb2040v3.cfg]
[include hardware/motion.cfg]
[include hardware/toolhead.cfg]
[include hardware/bed.cfg]
[include hardware/fans.cfg]

#####################################################################
#   Printing
#####################################################################
[include printing/filament_macros.cfg]
[include printing/printing_macros.cfg]
[include printing/gcode_extensions.cfg]

[gcode_arcs]
resolution: 0.1

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1B000E0011504B4633373520-if00
canbus_uuid: 8b5aa13b8e7b
canbus_interface: can0


[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 3000    			#Max 4000
max_z_velocity: 15 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
# 	LED Control
#####################################################################

#[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
#pin: PB6
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
home_xy_position:150,150
speed:100
z_hop:10

[z_tilt]

z_positions:
   -50, 18
   150, 348
   350, 18
points:
   30, 5
   150, 245
   270, 5

## Uncomment below for 350mm build
#z_positions:
#   -50, 18
#   175, 398
#   400, 18
#points:
#   30, 5
#   175, 295
#   320, 5


##--------------------------------------------------------------------

speed: 400
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE9, EXP1_2=PE10,
    EXP1_3=PE11, EXP1_4=PE12,
    EXP1_5=PE13, EXP1_6=PE14,    # Slot in the socket on this side
    EXP1_7=PE15, EXP1_8=PB10,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PB14, EXP2_2=PB13,
    EXP2_3=PF7, EXP2_4=PB12,
    EXP2_5=PE7, EXP2_6=PB11,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

# See the sample-lcd.cfg file for definitions of common LCD displays.

[neopixel skirt_rgb]
pin: PA9
chain_count: 32

[neopixel tak_rgb]
pin: PD15
chain_count: 32

