##	Set RGB values on boot up for each Neopixel. 
##	Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
       SET_LED LED="skirt_rgb" RED=0.4196 GREEN=0 BLUE=0.2392 SYNC=0 TRANSMIT=1
       #SET_LED LED="hotend_rgb" RED=0.702 GREEN=0 BLUE=0.7412 SYNC=0 TRANSMIT=1
       #SET_LED LED=skirt_rgb RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
       #SET_LED LED=skirt_rgb RED=1 GREEN=0 BLUE=0 INDEX=3 

