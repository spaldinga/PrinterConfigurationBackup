[include mainsail.cfg]
[include KAMP_Settings.cfg]

#####################################################################
#   Hardware - Physical components and their configurations
#####################################################################
[include hardware/motion.cfg]
[include hardware/chamber.cfg]
[include hardware/electronics_bay.cfg]
[include hardware/bed.cfg]
[include hardware/toolhead.cfg]
[include hardware/lights.cfg]

#####################################################################
#   Calibration - Tuning and testing tools
#####################################################################
[include calibration/pid_tuning_macros.cfg]
[include calibration/ADXL_SHAPER.cfg]

#####################################################################
#   Maintenance - Cleaning, monitoring, and upkeep
#####################################################################
[include maintenance/logging.cfg]
#[include maintenance/air_filter_timer.cfg]
#[include maintenance/nozzle_cleaning.cfg]

#####################################################################
#   Printing - Print job workflows and enhancements
#####################################################################
[include printing/filament_macros.cfg]
[include printing/printing_macros.cfg]
[include printing/gcode_extensions.cfg]

[printer]
kinematics: corexy
max_velocity: 500                    # Adjust based on your setup, 500 mm/s works fine with stock Creality stepper motors.
max_accel: 3000 #5000                      # Adjust based on your setup, 10000 mm/s2 works fine with stock Creality stepper motors.
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 250

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 60

[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True

[skew_correction]

[exclude_object]

#[save_variables]
#filename: ~/printer_data/config/saved_variables.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode:
  CANCEL_PRINT

[idle_timeout]
gcode:
   DISABLE_FANS
timeout: 600

# Get serail by
# ls /dev/serial/by-id/*
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4E00340002504B5735313920-if00

